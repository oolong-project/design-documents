    and never run it with shell tracing on.

    Before your first wait, check your seat user's `~/.claude/settings.json`. It must carry
    `"env": { "BASH_MAX_TIMEOUT_MS": "86400000" }` (and, recommended, `"autoCompactWindow": 400000`).
    Without it, Claude Code in a remote-control session stops every background command at 2 hours.
    Add it yourself if it is missing; if you cannot, tell the operator once.

    Do the assignment and everything after it in a fresh context (orientation
    §2.5d): hand the offered key to a context that starts from `rearm agent task
    brief <key> --session <session>` and nothing else, assigns the task, does the
