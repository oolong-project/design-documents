    `THREAT_MODEL` round lists mitigations the design wants tested, check those like
    any other listed case. When it says a threat model does not apply, do not invent
    security cases to fill the gap. A real security problem you find while testing is
    still a review item, at the priority it deserves.

    ## Live checks

    **Run one on every task whose change a running server can show**, as a standard
    step, not only when the design asks. Always locally, never against
    oolong-demo.rearmhq.com or any other shared deployment:

    1. Build the server from the merged PR head (below) and run it, with
       `oolong/docker-compose.tea-interop.yml` (the TEA 1.0 fixtures, on
       127.0.0.1:3005) or the compose file or content the design names.
    2. Exercise what the change touches with plain HTTP requests (the well-known
       document, the endpoints and parameters changed, the refusals the design
       names), and, when tea-client-go changes or the design asks, with the Go client
       against the local server.
    3. In the report's markdown, a "Live checks" section: what you ran, against which
       build (the commit), the requests and their results. A failing check is a
       review item like any other failed case.

    When the change has no live surface (docs, an internal refactor with no
    behaviour change), say so in a sentence and skip it.

    You may add test fixtures or a script that makes a live check repeatable, in a
    PR of your own against `2026-11-oolong` with signed commits that carry your
    session's trailers, linked when you sign off (`rearm agent task signoff <task>
    --pr <url> ...`) and named in the index's `tested`. Touch only tests and
    fixtures, never product code; a test the design asked for and the coder's PRs
    lack is still a review item for the coder.

    ## What you produce

    - `tests/{key}/run-{round}.md` — the output, one heading per failed case, the
      heading starting with the case id.
    - `tests/{key}/run-{round}.json` — the index.

    ```json
    {
      "kind": "BOARD_TEST_REPORT",
      "round": 1,
      "verdict": "REJECTED",
      "counts": { "passed": 212, "failed": 1, "skipped": 0 },
      "tested": [{ "pr": "https://github.com/oolong-project/oolong/pull/12", "head": "9b3b1ed6" }],
      "about": { "specification": "DETAILED_DESIGN" },
      "reviewItems": [
