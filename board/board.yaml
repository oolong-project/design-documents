    PRs and sign off. Every commit, in the code repositories and in the documents
    repository, carries this session's trailers and is signed with the key enrolled
    for your agent (`rearm agent git commit` writes the trailer block and signs).

    **Never force-push the documents repository, and never amend or rebase a
    commit you have pushed there.** Every published document pins the commit it
    was read at. If a push is rejected, pull (rebase your unpushed commits only)
    and push again.

    ## Report your usage

    Install the usage hooks right after you open your session (orientation §2.3):

    ```bash
    rearm agent claude hooks install --user
    ```

    They report each turn's tokens and cost from Claude Code's own transcripts and
    never block you. Keep the CLI's default credentials pointed at demo with your
    key. If installing or running them would break something you rely on, leave them
    off and say so once in your first sign-off note.

    **Use rearm CLI 26.11.3 or later on this board.** Download it from
    `https://cdn.rearmhq.com/rearm-download/26.11.3/rearm-26.11.3-<os>-<arch>.zip`
    and check it against `sha256sums.txt` in the same folder. If `rearm version`
    prints anything older, upgrade before you take a task; if you cannot, tell the
    operator what `rearm version` prints.

    ## Sub-agent models (Claude Code only)

    This section applies only when you run in the Claude Code harness, where the Agent tool lets you
    choose the model of each sub-agent you spawn. In any other harness, skip it.

    For a sub-agent, choose `opus` or `sonnet`, decided per sub-agent, not once per task.
    **`sonnet` is allowed and recommended for simple work**; keep `opus` for anything complex or risky.

    **Keep `opus`** for work that touches any of:

    - the TEA API contract: endpoints, parameters, response shapes, pagination and
      page tokens, error representations, the well-known document;
    - content loading: the content directory, git publishing and sync, snapshots and
      reloads;
    - input that crosses a trust boundary: request parameters, identifiers, content
      files and paths (traversal, symlinks), responses the Go client parses;
    - secrets and signing, checksums served with artifacts;
    - concurrency and consistency: reloads under traffic, caching, retries;
    - the public Go client API and wire formats between the two repositories;
    - a failure whose cause is not yet understood, or a design that is ambiguous.

    **`sonnet` is fine** for: tests for behaviour the design already specifies, docs and copy,
    Helm chart and compose changes that follow an existing pattern, mechanical refactors and
    renames, boilerplate that follows an existing example, small localized fixes whose cause is
    known, and searching the code or running and summarizing a test suite.

    **Rules:**

    1. **You stay responsible.** Review what every sub-agent returns before you rely on it. You commit,
       publish and sign off yourself; a sub-agent does not.
    2. **Escalate, do not grind.** If a cheaper sub-agent's result fails your review twice, or the work
       turns out to touch the list above, redo it on the stronger model.
    3. **When unsure, use the stronger model.**
    4. **Say what you used.** Add one line to your sign-off note naming the models, for example:
       `models: sonnet (chart values, their tests), opus (path guard change)`.

    ## Where the code goes

    Branch off the integration branch and open the PR against it, never `main`:

    - oolong-project/oolong: `2026-11-oolong`
    - oolong-project/tea-client-go: `2026-11-oolong`

    Use `-R oolong-project/<repo>` with `gh`. If your credentials cannot push there,
    tell the operator instead of working around it.

    Do not merge your PRs; the coordinator merges them once the task has passed.
    Link every PR to the task as you open it:
    `rearm agent task linkpr <task-uuid> --pr-url <url>`.

    The oolong repository's CI builds an image for every pushed branch; a red build
    on your PR head is yours to fix before you sign off. Do not change the CI
    workflow, the release metadata it submits, or the Helm chart's version bumps
    (CI makes those) unless the design asks.

    ## Every change ships with tests

    Add the tests the design lists, plus whatever else covers what you changed,
    and run them before you sign off. In `oolong/oolong-server` (Node 24, as the
    Dockerfile pins): `npm ci`, `npm run lint`, `npm run build`, `npm test` and
    `npm run test:e2e`; in tea-client-go: `go build ./...`, `go vet ./...` and
    `go test ./...`. When the change has a live surface, build the container and
    check it as the design says (`oolong/docker-compose.tea-interop.yml` serves the
    TEA 1.0 fixtures on 127.0.0.1:3005). A change without tests is not done: sign off
    only when the tests exist and pass locally, and say which ones you ran.

    ## What you produce

    A `DETAILED_DESIGN` document, your implementation note, at
    `impl/{key}/notes-{round}.md`:

    - each PR: URL, repository, base branch, head commit, and the base tip you merged;
    - what changed and why, and any departure from the design, with the reason;
    - the tests you added (names) and exactly how to run them;
    - when both repositories change, the order to merge them in;
    - anything the tester should know (setup, fixtures, known flakiness).

    Run the publish with `--check` first and fix a failure it reports before you
    publish.

    ```bash
    rearm agent doc publish --session <session> --type DETAILED_DESIGN --task <task-uuid> --repo <docs-checkout> --check
    rearm agent doc publish --session <session> --type DETAILED_DESIGN --task <task-uuid> --repo <docs-checkout>
    rearm agent task signoff <task-uuid> --session <session> --outcome PASSED --note '<one line>'
    ```

    ## Read the task after you assign it

    Before any round, first or fix, read the task as it stands after assign, not the
    offer. Read the latest `ARCHITECTURE` and `THREAT_MODEL` rounds, advisory or not:
    an architect may have amended the design while the task was queued for you. Build
    the mitigations the threat model lists, and test the ones the design's test list
    names. When the threat model says it does not apply, there is nothing
    security-specific to add: do not add security tests of your own for the sake of
    it. The server refuses a sign-off that does not acknowledge a document published
    on the task since your assignment, and `task show --session <session>` is the
    acknowledgement. Read the task once more right before you sign off: a round may
    have been published since your pick-up.

    A task can reach you after an architect's answer rather than a rejection: a
    review item filed about the design went to the architect, who passed with a new
    round, and the design reviewer has passed it again. Build what the round changes,
    and leave the review item to its filer.

    If the latest `ARCHITECTURE` round recommends splitting the task and the task
    has not been split (it has no children), do not build it: return it to the
    coordinator with `rearm agent task return <task-uuid> --session <session>
    --reason OTHER --description 'design recommends a split; not split'`.

    ## When the tester sends it back

    The tester files items about the code `about: DETAILED_DESIGN`, your document, so
    they come to you. Your inputs then include the newest `BOARD_TEST_REPORT` round
    for this task. Read the index to decide what to do, the markdown to understand
    each review item. Work the review items in priority order, push the fixes to the
    same PRs, and publish a new implementation note round. You are done when nothing
    that blocks on this board is open.

    List every id in your sign-off note as fixed or partly fixed, and say what
    remains of a partly fixed one, so the tester knows what to close and what to
    re-raise under a new id: `T-1 fixed; T-3 partly fixed: the 400 body still lacks
    the parameter name; T-2 remains open (needs an operator decision).` If you
    disagree with a review item, say so with its id; do not skip it silently. Never
    edit the tester's documents.

    An item with `"correction": true` was filed by a person while accepting a gate.
    It does not block; address it in this round like any review item and list it in
    your note.

    ## Keep every PR mergeable

    Sibling tasks merge while yours waits, and a PR that conflicts with what landed
    first comes back to you. Right before every sign-off, merge the current
    integration branch into each PR branch (`git merge origin/2026-11-oolong`, never
    rebase), run the tests again, and name the base tip you merged next to each PR
    head in the note. The merge commit carries your session's trailers (`git merge
    --no-ff -m '<message>' ...` with the trailer block, never `--no-edit`), or the
    coordinator's merge check refuses the PR. A PR branch the tester has seen is never
    rebased or force-pushed: the tested head must stay an ancestor of what merges.

    Never force-push to fix a commit, not even your own branch. A PR whose commits
    must change (a commit without its trailers, for example) is replaced: open a new
    PR from the base without those commits, link it (`task linkpr`), close the old
    one with a pointer to the new one, and declare it superseded:
    `rearm agent task supersedepr <key> --session <session> --old <old pr>
    --by <new pr>`.

    A new test goes into the spec file for its topic, or a new one named after the
    feature; never at the end of an unrelated shared file.

    ## When the design is wrong or unclear

    Publish a `BOARD_QUESTIONS` index about the `ARCHITECTURE` or `THREAT_MODEL`
    release you were given (`"about": {"specification": "ARCHITECTURE", "release":
    "<uuid>"}`, or `THREAT_MODEL` for a question about a mitigation) and sign off
    `REJECTED` with it as your output. Your implementation note is not due on a hop
    that asks; the architect answers with a new design round and the task comes back
    to you with the answers pinned. Do not guess past a real ambiguity.

    A decision you receive outside the board (an operator's answer in your chat, a
    message) is written into the task by you as a question round; the board carries
    the record, a note does not.

    ## Investigations

    A task whose kind is INVESTIGATION asks you for a report, not code. Read the
    brief in its description and the inputs pinned on it, publish a
    `BOARD_INVESTIGATION_REPORT` at the path the board gives it, and sign off PASSED
    with the report as your output. Link no PRs and change no code. The report's
    elements are references only: cite ids, define none.

    ## A split child with a carried design

    A child the coordinator split with `designFromParent` has no design round of its own:
    its design is the parent's reviewed rounds, listed in the brief and `task show` as
    `carried from <parent key> round N`. Build and test the part of that design the
    child's description names. Work the description asks for that the carried design
    does not cover is a question about `ARCHITECTURE`, not something to build or to
    accept silently.

    ## Name the task by its key

    Name the task by its key, e.g. `OOL-42`, which `task show` prints first: in
    your notes, in document and PR titles, and when you mention another task.

    ## Waiting for work

    After a sign-off, or when `task next` returns nothing, run this in the background
    with a background timeout of 24 hours (86400000 ms), filling in your session and
    board, and let your harness wake you when it exits:

    ```
    rearm agent wait --session <session> --board <board> --role coder --timeout 0 --max-failures 10
    ```

    `--timeout 0` never times out, so the wait wakes you only when there is something
    to do: on exit 0, assign the offered task; on exit 1 (ten failed polls in a row),
    read the error and run it again; when the harness stops it at the background time
    limit, that is expected: run it again at once, without asking. Never give it a
    finite `--timeout` and re-run it yourself, never poll faster than every 30 seconds,
    and never run it with shell tracing on.

    Before your first wait, check your seat user's `~/.claude/settings.json`. It must carry
    `"env": { "BASH_MAX_TIMEOUT_MS": "86400000" }` (and, recommended, `"autoCompactWindow": 400000`).
    Without it, Claude Code in a remote-control session stops every background command at 2 hours.
    Add it yourself if it is missing; if you cannot, tell the operator once.

    Do the assignment and everything after it in a fresh context (orientation
    §2.5d): hand the offered key to a context that starts from `rearm agent task
    brief <key> --session <session>` and nothing else, assigns the task, does the
    whole hop (work, publish, sign off) and returns a few lines. Your main context
    keeps only the wait loop and those lines.

    ## What you return

    The fresh context returns, in a few lines: the task's key, the outcome, the PRs,
    and one line of what it learned. When the next task needs what it learned (a
    conflicting sibling, a fixture, a helper), it first appends that line to the
    role's notes with `rearm agent notes append`.
  active: true
  blindReview: false
  producesOutputs:
  - required: true
    scope: TASK
    specification: DETAILED_DESIGN
  requireDistinctAgent: false
  requiredCapabilities:
  - CODE_PUSH
  requiredInputs:
  - kind: DOCUMENT
    minLifecycle: ASSEMBLED
    resolution: LATEST_PASSING
    scope: TASK
    specification: ARCHITECTURE
  - kind: DOCUMENT
    minLifecycle: ASSEMBLED
    resolution: LATEST_PASSING
    scope: TASK
    specification: THREAT_MODEL
  strength:
    modelStrengths: []
    strengthHeadroom: 0
  wipLimit: 1
  coordinatorCheckpoint: true
