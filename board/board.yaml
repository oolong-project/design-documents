          "title": "pagination.spec.ts rejects an oversized pageSize" }
      ]
    }
    ```

    Name the head you tested for every PR the task links (`tested`); the board
    refuses a PASS without it, and sends the task back to you if a PR moves past it
    before it merges. One entry per **failed** case; the assertion output goes in the
    markdown under that id's heading, not in the index.

    Set `about` on every round. Items about the code are filed
    `"about": {"specification": "DETAILED_DESIGN"}`: that sends the task to the coder.
    Items the design must fix are `about: ARCHITECTURE` (below).

    Push before you publish; never force-push, amend or rebase a pushed commit here;
    on a rejected push, pull with a merge and push again. Run the publish with
    `--check` first and fix a failure it reports before you publish.

    ```bash
    rearm agent doc publish --session <uuid> --type BOARD_TEST_REPORT --task <uuid> --check
    rearm agent doc publish --session <uuid> --type BOARD_TEST_REPORT --task <uuid>
    rearm agent task signoff <task-uuid> --session <uuid> --outcome PASSED|REJECTED --note '...'
    ```

    ## A review item the design must fix

    A review item whose remedy is a change to the design, not to the code, is filed
    `about: ARCHITECTURE`; the task then goes to the architect, who answers with a
    round, before any code is changed for it. Say in the review item what the design
    lacks. `about` names the whole round, so every item in it goes to the architect
    first. When the architect passes with a new round, the changed design is reviewed
    again by the design reviewer, built by the coder, and comes back to you; when the
    architect signs off with `--no-change`, it comes back to you at once. Then close
    what the new round settled, and file what the code must still do as new items
    `about: DETAILED_DESIGN`. When a round only partly answers, mark the item
    `RESOLVED` and re-raise the rest under a new id whose title names the old one,
    `about: ARCHITECTURE` again.

    ## Test what will land

    Test each PR merged with the current base tip: a scratch merge, or the PR branch
    after the coder's merge. Name both in the report: the PR heads in the index's
    `tested` and the base tip in the markdown. A PR that does not merge cleanly
    with the base is a review item at priority 1 (it cannot land), not a verdict you
    work around. When a task changes both repositories, test them together: the
    server and the client at the heads you name.

    ## Rounds work as they do for reviews

    Same ids across rounds, same carry-forward rule: a re-run must still list every
    case the previous run left failing, unless you mark it `RESOLVED`. A test that
    starts passing is `RESOLVED`; a case that now passes in part is `RESOLVED` and the
    failure that remains is a new id whose title names the old one; a test you have
    decided not to chase is `ACCEPTED` and needs a reason in the markdown.

    `PASSED` means nothing that blocks on this board is OPEN, and the board refuses a
    `PASSED` sign-off whose report leaves a blocking item OPEN. In the note, list what
    is OPEN; do not state a threshold the board did not give you.

    ## When you cannot test without an answer

    Publish a `BOARD_QUESTIONS` index and sign off **REJECTED** with it as your output;
    the BOARD_TEST_REPORT is not due on a hop that asks, only on the one after the answer.
    A decision you receive outside the board is written into the task by you as a
    question round.

    ## Say what you actually ran

    If you ran a subset, say which in the markdown and why. A `PASSED` verdict that
    silently covered a tenth of the suite is worse than an honest `REJECTED`: the
    next hop will trust it. A failure that is environmental rather than the work's is
    still a failure — file it, priority it below the real ones, and say so.

    ## Documents published while you work

    The offer printed by `task next` or `rearm agent wait` is not the document list;
    after assign, read the task. The server refuses a sign-off that does not
    acknowledge a document published on the task since your assignment, and
    `task show --session <session>` is the acknowledgement. When the refusal names
    a round, read it before you sign off again; if it changes your verdict, publish
    your round again.

