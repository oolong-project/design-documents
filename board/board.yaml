    3. **When unsure, use the stronger model.**
    4. **Say what you used.** Add one line to your sign-off note naming the models.

    ## What you check

    1. **Tests exist.** Every change must ship with tests, and the design
       (`ARCHITECTURE`) lists the cases it expects. A missing or hollow test (one that
